# --- DataSource desde variables de entorno ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate/JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# Hikari (prod)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Logging
logging.level.com.galtekone=INFO
logging.level.org.hibernate.SQL=WARN

# ---- Server / Context Path ----
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/GaltekOne}
server.port=${PORT:5000}   # EB suele pasar PORT; usa 5000 por defecto

# ---- JWT / Sesión (desde env, con defaults seguros) ----
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.access-exp-ms=${APP_JWT_ACCESS_EXP_MS:43200000}

app.session.idle-max-seconds=${APP_SESSION_IDLE_MAX_SECONDS:3600}
app.session.absolute-max-ms=${APP_SESSION_ABSOLUTE_MAX_MS:43200000}

# ---- Rutas de llaves RSA (relativas al bundle) ----
app.rsa.public-path=${APP_RSA_PUBLIC_PATH:keys/public_key.pem}
app.rsa.private-path=${APP_RSA_PRIVATE_PATH:keys/private_key.pem}
