# ====================
# PERFIL: DESKTOP
# ====================
server.port=18080
server.address=127.0.0.1
server.servlet.context-path=/GaltekOne

spring.datasource.url=jdbc:sqlite:${user.home}/AppData/Roaming/GaltekOne/galtek-one.db?busy_timeout=5000&journal_mode=WAL&synchronous=NORMAL&foreign_keys=on
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# La base desktop se prepara con database-setup.ps1.
# No ejecutar seeds en cada arranque: los seeds de demo usan IDs fijos y pueden pisar cambios reales.
spring.sql.init.mode=never
spring.sql.init.data-locations=classpath:data-desktop.sql
spring.jpa.defer-datasource-initialization=true

app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.access-exp-ms=${APP_JWT_ACCESS_EXP_MS:43200000}
app.session.idle-max-seconds=${APP_SESSION_IDLE_MAX_SECONDS:1800}
app.session.absolute-max-ms=${APP_SESSION_ABSOLUTE_MAX_MS:43200000}
app.session.touch-min-seconds=${APP_SESSION_TOUCH_MIN_SECONDS:60}
app.security.login.max-attempts=${APP_SECURITY_LOGIN_MAX_ATTEMPTS:5}
app.security.login.lock-minutes=${APP_SECURITY_LOGIN_LOCK_MINUTES:15}
app.rsa.public-path=${APP_RSA_PUBLIC_PATH:${user.home}/AppData/Roaming/GaltekOne/keys/public_key.pem}
app.rsa.private-path=${APP_RSA_PRIVATE_PATH:${user.home}/AppData/Roaming/GaltekOne/keys/private_key.pem}
